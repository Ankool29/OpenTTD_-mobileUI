name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'mobile/**'
    paths-ignore:
      - '**.md'

permissions:
  contents: read

env:
  VCPKG_BASELINE: f3e10653cc27d62a37a3763cd84b38bca07c6075
  VCPKG_TRIPLET: arm64-android-shared
  NDK_VERSION: 28.2.13676358
  SDL_VERSION: 2.32.10

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;${{ env.NDK_VERSION }}'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Export Android environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/downloads
            vcpkg/buildtrees
            vcpkg/packages
            vcpkg/installed
          key: vcpkg-${{ env.VCPKG_BASELINE }}-${{ env.VCPKG_TRIPLET }}-${{ env.NDK_VERSION }}-${{ hashFiles('vcpkg.json', 'android/triplets/**') }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_BASELINE }}-${{ env.VCPKG_TRIPLET }}-

      - name: Bootstrap vcpkg
        run: |
          if [ ! -d vcpkg/.git ]; then
            rm -rf /tmp/vcpkg-clone
            git clone https://github.com/microsoft/vcpkg.git /tmp/vcpkg-clone
            mv /tmp/vcpkg-clone/.git vcpkg/.git
            rm -rf /tmp/vcpkg-clone
          fi
          git -C vcpkg fetch --depth 1 origin "${{ env.VCPKG_BASELINE }}"
          git -C vcpkg reset --hard -q "${{ env.VCPKG_BASELINE }}"
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"

      - name: Build host tools
        run: |
          cmake -S . -B build-host -G Ninja -DOPTION_TOOLS_ONLY=ON
          cmake --build build-host --target tools -j "$(nproc)"

      - name: Configure native build
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHOST_BINARY_DIR="$GITHUB_WORKSPACE/build-host" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DVCPKG_TARGET_TRIPLET="${{ env.VCPKG_TRIPLET }}" \
            -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/android/triplets" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_ROOT/installed" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DOPTION_USE_ASSERTS=OFF

      - name: Build native library
        run: cmake --build build-android --target openttd -j "$(nproc)"

      - name: Stage runtime data
        run: |
          cmake --build build-android --target baseset_files language_files -j "$(nproc)"
          ASSETS=android/app/src/main/assets
          rm -rf "$ASSETS/baseset" "$ASSETS/lang"
          mkdir -p "$ASSETS/baseset" "$ASSETS/lang"
          find build-android/baseset -maxdepth 1 -type f -exec cp {} "$ASSETS/baseset/" \;
          cp build-android/lang/*.lng "$ASSETS/lang/"
          test -n "$(ls -A "$ASSETS/baseset")"
          test -n "$(ls -A "$ASSETS/lang")"
          ls -lh "$ASSETS/baseset"
          echo "Language files: $(find "$ASSETS/lang" -name '*.lng' | wc -l)"

      - name: Fetch SDL Java glue
        run: |
          curl -fsSL -o /tmp/SDL2.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${{ env.SDL_VERSION }}/SDL2-${{ env.SDL_VERSION }}.tar.gz"
          tar -xzf /tmp/SDL2.tar.gz -C /tmp
          mkdir -p android/app/src/main/java android/app/src/main/res
          cp -r "/tmp/SDL2-${{ env.SDL_VERSION }}/android-project/app/src/main/java/." android/app/src/main/java/
          cp -r "/tmp/SDL2-${{ env.SDL_VERSION }}/android-project/app/src/main/res/." android/app/src/main/res/

      - name: Stage native libraries
        run: |
          JNI_DIR=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$JNI_DIR"
          cp "$(find build-android -name 'libmain.so' -print -quit)" "$JNI_DIR/"
          cp "$VCPKG_ROOT/installed/${{ env.VCPKG_TRIPLET }}/lib/"*.so "$JNI_DIR/"
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$JNI_DIR/"
          ls -lh "$JNI_DIR"

      - name: Strip native libraries
        run: |
          STRIP="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          find android/app/src/main/jniLibs -name '*.so' -exec "$STRIP" --strip-unneeded {} +
          du -sh android/app/src/main/jniLibs

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0-experimental.${{ github.run_number }}
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/*.apk artifacts/openttd-mobile-arm64.apk
          sha256sum artifacts/openttd-mobile-arm64.apk | tee artifacts/openttd-mobile-arm64.apk.sha256
          ls -lh artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openttd-mobile-apk-${{ github.run_number }}
          path: artifacts/
          retention-days: 30
